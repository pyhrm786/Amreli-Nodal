<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GETCO Admin | Master Control</title>
    <link rel="stylesheet" href="styles/adminpanel.css">
    <link rel="icon" type="image/png" href="images/Logo_GETCO.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <header class="admin-header">
        <div class="header-left">
            <img src="images/Logo_GETCO.png" alt="Logo" class="admin-logo">
            <div class="header-text">
                <span class="division">Amreli Transmission Division</span>
                <span class="portal">Admin Management Portal</span>
            </div>
        </div>
        <button class="logout-btn" onclick="window.location.href='index.html'">Logout</button>
    </header>

    <main class="admin-content">
        <div class="generate-wrapper">
            <button class="generate-unfold-btn" onclick="toggleGenerateMenu()">
                <span class="icon">📊</span>
                Generate Reports
                <span class="arrow" id="menu-arrow">▼</span>
            </button>
            <div class="generate-menu-content" id="gen-menu">
                <div class="menu-inner">
                    <div class="date-section">
                        <label for="gen-date">Target Date</label>
                        <input type="date" id="gen-date" class="menu-date-input">
                    </div>

                    <div class="report-grid">
                        <button class="report-btn" onclick="exportData('lmu')">LMU Detail</button>
                        <button class="report-btn" onclick="exportData('voltage')">Voltage Detail</button>
                        <button class="report-btn" onclick="exportData('capacitor')">Capacitor Bank</button>
                        <button class="report-btn" onclick="exportData('line')">Line Detail</button>
                    </div>
                    <div class="check-status-form">
                        <div class="check-status-button">
                            <button class="check-status" onclick="getstatus();">
                                <span class="icon">&#128269</span>
                                Check Status
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="table-of-status">
            <table class="status-table">
            </table>
        </div>
        <div class="form-grid">
            <section class="addbutton">
                <button class="addssbutton" onclick="expandadss();">⇒ Add New Substation</button>
            </section>
        </div>
        <section class="admin-card f1 a1">
            <div class="card-title">Register New Substation</div>
            <div class="input-group">
                <input type="text" id="new-ss-name" required>
                <label>Substation Name</label>
            </div>
            <div class="input-group">
                <input type="text" id="new-ss-id" required>
                <label>Substation ID</label>
            </div>
            <div class="input-group">
                <input type="text" id="new-ss-user" required>
                <label>Assign Username</label>
            </div>
            <div class="input-group">
                <input type="password" id="new-ss-pass" required>
                <label>Set Password</label>
            </div>
            <button class="primary-btn" onclick="addSubstation()">Add Substation</button>
        </section>
        <div class="form-grid">
            <section class="addbutton">
                <button class="addfeederbutton" onclick="expandadfeeder();">⇒ Add New Feeder</button>
            </section>
        </div>
        <section class="admin-card f2 a2">
            <div class="card-title">Add Feeder to Substation</div>
            <div class="input-group">
                <select id="ss-dropdown">
                    <option value="" disabled selected>Select Substation...</option>
                </select>
            </div>
            <div class="input-group">
                <input type="text" id="new-feeder-name" required>
                <label>Feeder Name</label>
            </div>
            <div class="input-group">
                <input type="text" id="new-feeder-type" required>
                <label>Feeder Type</label>
            </div>
            <div class="input-group">
                <input type="text" id="new-feeder-group" required>
                <label>Feeder Group</label>
            </div>
            <button class="primary-btn" onclick="addFeeder()">Link New Feeder</button>
        </section>

        <section class="admin-card table-card">
            <div class="card-title">Database Management</div>
            <div class="tabs">
                <button class="tab-btn active" id="g1" onclick="showTabss()">Substations</button>
                <button class="tab-btn" id="g2" onclick="showTabfed()">Feeders</button>
                <div class="d1 off" id="d1">
                    <select id="ss-dropdown2" class="drop">
                    </select>
                    <button class="show" onclick="showselected();">Show</button>
                </div>
            </div>

            <div class="table-container">
                <table id="mgmt-table">
                    <thead>
                    </thead>
                    <tbody id="mgmt-body">
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="script/admin.js"></script>
</body>
</html>
